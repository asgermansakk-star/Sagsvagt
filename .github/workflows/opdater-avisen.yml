      - name: Upload sagssider s-z
        id: upload4
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/sag/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}sag/
          state-name: .ftp-state-s-z.json
          timeout: 120000
          exclude: |
            [!s-z]*

      - name: Vent 2 minutter (Upload sagssider s-z)
        if: steps.upload4.outcome == 'failure'
        run: sleep 120

      - name: Upload sagssider s-z (nyt forsøg)
        id: upload4b
