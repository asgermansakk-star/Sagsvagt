          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/assets/sager/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}assets/sager/
          state-name: .ftp-state-h-k.json
          timeout: 120000
          exclude: |
