# Henter nye dagsordener og referater, bygger avisen igen og uploader den til
# sagsvagt.dk hos Simply via FTPS. Kører hver morgen og eftermiddag (dansk tid),
# når nogen pusher til main, og kan også startes manuelt under "Actions".
#
# Kræver tre hemmeligheder (Settings > Secrets and variables > Actions):
#   FTP_SERVER    ftp.simply.com (port 21, FTPS)
#   FTP_USERNAME  FTP-brugernavnet fra Simply
#   FTP_PASSWORD  FTP-adgangskoden fra Simply
# Valgfri variabel FTP_SERVER_DIR (standard: public_html/).
name: Opdater avisen

on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 14 * * *"
  push:
    branches: [main]
  # Ingen "ryd webhotellet"-mulighed: den ville også slette api/_konfig.php, som kun findes på serveren
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opdater-avisen
  cancel-in-progress: false

jobs:
  opdater:
    runs-on: ubuntu-latest
    # Første upload er alle ~4.000 filer over FTPS og tager omkring en time. Derefter uploades kun ændrede filer.
    timeout-minutes: 180
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Ved push bygger vi bare det, der er i repoet; robotten kører kun på tidsplan/manuelt,
      # eller når commit-beskeden indeholder [hent]
      - name: Hent nye sager fra kk.dk
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        run: node avis/hent-kk.mjs
        env:
          SIDER: "2"

      # Andre kommuner (avis/firstagenda.json) hentes som PDF via sitemappet, som robots.txt tillader.
      # Fejler en kommune, opdateres København alligevel.
      - name: Installer pdftotext
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Find FirstAgenda-portalen for kommuner, vi ikke har endnu (tjekkes højst én gang om ugen pr. kommune),
      # og åbn de næste BATCH kommuner. Første hentning og første upload af en kommune er tung, derfor i bidder.
      - name: Find og åbn nye kommuner
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        continue-on-error: true
        run: node avis/find-kommuner.mjs && node avis/aabn-kommuner.mjs
        env:
          BATCH: ${{ vars.BATCH || '10' }}

      # Kommunerne hentes ti ad gangen (hver server får stadig kun én forespørgsel ad gangen).
      # DAGE: hvor langt tilbage en ny kommune hentes første gang.
      - name: Hent nye sager fra andre kommuner (FirstAgenda)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        continue-on-error: true
        run: node avis/hent-firstagenda.mjs
        env:
          SAMTIDIG: "10"
          DAGE: "120"

      - name: Kvalitet pr. kommune
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        continue-on-error: true
        run: node avis/kvalitet.mjs

      # "Hvad betyder det for dig?" og "For og imod" til de vigtigste nye sager (avis/perspektiv.mjs).
      # Kører kun, når hemmeligheden ANTHROPIC_API_KEY er sat. MAKS styrer hvor mange sager pr. kørsel.
      - name: Skriv For og imod med AI
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        continue-on-error: true
        run: node avis/perspektiv.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKS: ${{ vars.PERSPEKTIV_MAKS || '120' }}

      - name: Byg avisen
        run: node avis/byg.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sagsvagt.dk/' }}

      - name: Gem ændringer i repoet
        run: |
          git config user.name "Sagsvagt-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ingen ændringer at gemme."
          else
            git commit -m "Opdater avisen $(date -u +%Y-%m-%d)"
            git push
          fi

      # Kun de offentlige filer kommer på webhotellet. .htaccess skal med (forside og
      # midlertidig lukning af avisen styres dér); alle andre dotfiler bliver hjemme.
      - name: Saml de offentlige filer
        run: |
          rsync -a --delete \
            --include '/.htaccess' \
            --exclude '.*' --exclude '_deploy' --exclude 'node_modules' \
            --exclude 'avis' --exclude 'data' --exclude 'package*.json' --exclude 'README.md' \
            ./ _deploy/
          echo "Filer til upload: $(find _deploy -type f | wc -l)"

      - name: Upload til Simply (FTPS)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          timeout: 120000

      - name: Mangler FTP-oplysninger
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP_SERVER er ikke sat, så avisen blev ikke uploadet til sagsvagt.dk."
