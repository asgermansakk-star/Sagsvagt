          protocol: ftps
          port: 21
          local-dir: ./_deploy/assets/sager/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}assets/sager/
          state-name: .ftp-state-l-r.json
          timeout: 120000
          exclude: |
            [!l-r]*

      - name: Upload sags-json s-z
        id: upload8
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/assets/sager/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}assets/sager/
          state-name: .ftp-state-s-z.json
          timeout: 120000
          exclude: |
            [!s-z]*

      - name: Vent 2 minutter (Upload sags-json s-z)
        if: steps.upload8.outcome == 'failure'
        run: sleep 120

      - name: Upload sags-json s-z (nyt forsøg)
        id: upload8b
        if: steps.upload8.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/assets/sager/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}assets/sager/
          state-name: .ftp-state-s-z.json
          timeout: 120000
          exclude: |
            [!s-z]*

      # Fejlede en bid også i andet forsøg, er kørslen rød (så alarmen ser det). Bidderne gemmer hver deres tilstand,
      # så næste kørsel fortsætter med det, der mangler.
      - name: Tjek uploaden
        if: env.FTP_SERVER != ''
        run: |
          if [ "${{ steps.upload0.outcome }}" = failure ] && [ "${{ steps.upload0b.outcome }}" != success ]; then echo "::error::Uploadbid upload0 fejlede to gange"; FEJL=1; fi
          if [ "${{ steps.upload1.outcome }}" = failure ] && [ "${{ steps.upload1b.outcome }}" != success ]; then echo "::error::Uploadbid upload1 fejlede to gange"; FEJL=1; fi
          if [ "${{ steps.upload2.outcome }}" = failure ] && [ "${{ steps.upload2b.outcome }}" != success ]; then echo "::error::Uploadbid upload2 fejlede to gange"; FEJL=1; fi
          if [ "${{ steps.upload3.outcome }}" = failure ] && [ "${{ steps.upload3b.outcome }}" != success ]; then echo "::error::Uploadbid upload3 fejlede to gange"; FEJL=1; fi
          if [ "${{ steps.upload4.outcome }}" = failure ] && [ "${{ steps.upload4b.outcome }}" != success ]; then echo "::error::Uploadbid upload4 fejlede to gange"; FEJL=1; fi
          if [ "${{ steps.upload5.outcome }}" = failure ] && [ "${{ steps.upload5b.outcome }}" != success ]; then echo "::error::Uploadbid upload5 fejlede to gange"; FEJL=1; fi
          if [ "${{ steps.upload6.outcome }}" = failure ] && [ "${{ steps.upload6b.outcome }}" != success ]; then echo "::error::Uploadbid upload6 fejlede to gange"; FEJL=1; fi
          if [ "${{ steps.upload7.outcome }}" = failure ] && [ "${{ steps.upload7b.outcome }}" != success ]; then echo "::error::Uploadbid upload7 fejlede to gange"; FEJL=1; fi
          if [ "${{ steps.upload8.outcome }}" = failure ] && [ "${{ steps.upload8b.outcome }}" != success ]; then echo "::error::Uploadbid upload8 fejlede to gange"; FEJL=1; fi
          exit ${FEJL:-0}

      - name: Mangler FTP-oplysninger
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP_SERVER er ikke sat, så avisen blev ikke uploadet til sagsvagt.dk."
