# Henter nye dagsordener og referater, bygger avisen igen og uploader den til
# sagsvagt.dk hos Simply via FTPS. Kører hver morgen og eftermiddag (dansk tid),
# når nogen pusher til main, og kan også startes manuelt under "Actions".
#
# Kræver tre hemmeligheder (Settings > Secrets and variables > Actions):
#   FTP_SERVER    ftp.simply.com (port 21, FTPS)
#   FTP_USERNAME  FTP-brugernavnet fra Simply
#   FTP_PASSWORD  FTP-adgangskoden fra Simply
# Valgfri variabel FTP_SERVER_DIR (standard: public_html/).
name: Opdater avisen

on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 14 * * *"
  push:
    branches: [main]
  # Ingen "ryd webhotellet"-mulighed: den ville også slette api/_konfig.php, som kun findes på serveren
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opdater-avisen
  cancel-in-progress: false

jobs:
  opdater:
    runs-on: ubuntu-latest
    # Første upload er alle filer over FTPS og tager timer. Derefter uploades kun ændrede filer. Når mange sider
    # ændres på én gang (nye kommuner, nyt layout), kan uploaden tage over to timer; derfor 350 minutter (maks. er 360).
    timeout-minutes: 350
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Ved push bygger vi bare det, der er i repoet; robotten kører kun på tidsplan/manuelt,
      # eller når commit-beskeden indeholder [hent]
      - name: Hent nye sager fra kk.dk
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        run: node avis/hent-kk.mjs
        env:
          SIDER: "2"

      # Andre kommuner (avis/firstagenda.json) hentes som PDF via sitemappet, som robots.txt tillader.
      # Fejler en kommune, opdateres København alligevel.
      - name: Installer pdftotext
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Find FirstAgenda-portalen for kommuner, vi ikke har endnu (tjekkes højst én gang om ugen pr. kommune),
      # og åbn de næste BATCH kommuner. Første hentning og første upload af en kommune er tung, derfor i bidder.
      - name: Find og åbn nye kommuner
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        continue-on-error: true
        run: node avis/find-kommuner.mjs && node avis/aabn-kommuner.mjs
        env:
          BATCH: ${{ vars.BATCH || '10' }}

      # Kommunerne hentes ti ad gangen (hver server får stadig kun én forespørgsel ad gangen).
      # DAGE: hvor langt tilbage en ny kommune hentes første gang.
      # Natkort til toppen af mandagsmailen, forsiden og Min avis for kommuner, der lige er åbnet.
      # avis/natkort.mjs laver kun de kort, der mangler, og stopper aldrig robotten.
      - name: Natkort til nye kommuner
        continue-on-error: true
        run: node avis/natkort.mjs

      - name: Hent nye sager fra andre kommuner (FirstAgenda)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        continue-on-error: true
        run: node avis/hent-firstagenda.mjs
        env:
          SAMTIDIG: "10"
          DAGE: "120"

      - name: Kvalitet pr. kommune
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        continue-on-error: true
        run: node avis/kvalitet.mjs

      # "Hvad betyder det for dig?" og "For og imod" til de vigtigste nye sager (avis/perspektiv.mjs).
      # Kører kun, når hemmeligheden ANTHROPIC_API_KEY er sat. MAKS styrer hvor mange sager pr. kørsel.
      - name: Skriv For og imod med AI
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[hent]')
        continue-on-error: true
        run: node avis/perspektiv.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKS: ${{ vars.PERSPEKTIV_MAKS || '120' }}

      - name: Byg avisen
        run: node avis/byg.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sagsvagt.dk/' }}

      # Sagsvagt Erhverv: kommunernes EU-udbud fra TED (data/udbud.json), projektkort til nye signaler og signalindekset til
      # kundernes rapport og mail (api/_erhverv-signaler.json, ikke i repoet). Indekset bygges før og efter kortene.
      # Ingen AI endnu (Asgers beslutning 26/10): uden ANTHROPIC_API_KEY finder avis/erhverv-fakta.mjs kun beløbet.
      # Stederne til kortet slås op i OpenStreetMap og fejler aldrig robotten.
      - name: Sagsvagt Erhverv
        continue-on-error: true
        run: |
          node avis/udbud.mjs
          node avis/signaler.mjs --indeks
          node avis/erhverv-fakta.mjs
          node avis/erhverv-fakta.mjs --steder 100 || true
          node avis/signaler.mjs --indeks
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sagsvagt.dk/' }}

      - name: Gem ændringer i repoet
        run: |
          git config user.name "Sagsvagt-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ingen ændringer at gemme."
          else
            git commit -m "Opdater avisen $(date -u +%Y-%m-%d)"
            # Nogen kan have pushet til main, mens robotten hentede (kørslen tager timer). Læg robottens commit
            # ovenpå; ved konflikt i data-filer vinder robottens nyeste hentning.
            git pull --rebase -X theirs
            git push
          fi

      # Kun de offentlige filer kommer på webhotellet (plan/ er interne noter og bliver hjemme). .htaccess skal med (forside og
      # midlertidig lukning af avisen styres dér); alle andre dotfiler bliver hjemme.
      - name: Saml de offentlige filer
        run: |
          rsync -a --delete \
            --include '/.htaccess' \
            --exclude '.*' --exclude '_deploy' --exclude 'node_modules' \
            --exclude 'avis' --exclude 'data' --exclude 'plan' --exclude 'package*.json' --exclude 'README.md' \
            ./ _deploy/
          echo "Filer til upload: $(find _deploy -type f | wc -l)"

      # Uploaden er delt i bidder med hver sin tilstandsfil. Hver bid gemmer, hvad der ligger på serveren, når den er
      # færdig, så en kørsel, der rammer tidsgrænsen, ikke starter forfra næste gang. De ~21.500 sagssider og de lige
      # så mange sags-json'er tager ellers over 5 timer, når alle sider ændres på én gang (nyt layout, 25/10-2026).
      # Bidderne er udeladt fra hovedtrinnet (der heller ikke sletter dem på serveren, fordi exclude også gælder dér).
      # Simply svarer af og til "421 Service temporarily unavailable". Hver bid får derfor et nyt forsøg efter 2 minutter.
      - name: Upload til Simply (FTPS)
        id: upload0
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          state-name: .ftp-deploy-sync-state.json
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            sag/**
            assets/sager/**

      - name: Vent 2 minutter (Upload til Simply (FTPS))
        if: steps.upload0.outcome == 'failure'
        run: sleep 120

      - name: Upload til Simply (FTPS) (nyt forsøg)
        id: upload0b
        if: steps.upload0.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          state-name: .ftp-deploy-sync-state.json
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            sag/**
            assets/sager/**

      - name: Upload sagssider a-g
        id: upload1
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/sag/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}sag/
          state-name: .ftp-state-a-g.json
          timeout: 120000
          exclude: |
            [!a-g]*

      - name: Vent 2 minutter (Upload sagssider a-g)
        if: steps.upload1.outcome == 'failure'
        run: sleep 120

      - name: Upload sagssider a-g (nyt forsøg)
        id: upload1b
        if: steps.upload1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/sag/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}sag/
          state-name: .ftp-state-a-g.json
          timeout: 120000
          exclude: |
            [!a-g]*

      - name: Upload sagssider h-k
