        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/sag/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}sag/
          state-name: .ftp-state-s-z.json
          timeout: 120000
          exclude: |
            [!s-z]*

      - name: Upload sags-json a-g
        id: upload5
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_deploy/assets/sager/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}assets/sager/
          state-name: .ftp-state-a-g.json
          timeout: 120000
          exclude: |
            [!a-g]*

      - name: Vent 2 minutter (Upload sags-json a-g)
