# Henter nye dagsordener og referater og bygger avisen igen.
# Kører hver morgen og eftermiddag (dansk tid) og kan også startes manuelt.
name: Opdater avisen

on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opdater-avisen
  cancel-in-progress: false

jobs:
  opdater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Hent nye sager fra kk.dk
        run: node avis/hent-kk.mjs
        env:
          SIDER: "2"

      - name: Byg avisen
        run: node avis/byg.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sagsvagt.dk/' }}

      - name: Gem ændringer
        run: |
          git config user.name "Sagsvagt-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ingen nye sager."
          else
            git commit -m "Opdater avisen $(date -u +%Y-%m-%d)"
            git push
          fi
