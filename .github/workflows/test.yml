# Testpipelinen for sagsvagt.dk i fire trin: unittest → integrationstest → E2E-test → performancetest.
# Et trin kører kun, når det forrige er grønt. Kører ved push til alle andre grene end main. På main kører den som
# første job i "Opdater avisen" (opdater-avisen.yml), så robotten kun henter, bygger og uploader, når alle fire er grønne.
# E2E og performance bygger siderne først (node avis/byg.mjs), så de måler den nyeste kode og ikke robottens sidste byg.
# Lokalt: npm test (eller ét trin ad gangen: npm run test:unit, test:integration, test:e2e, test:perf).
name: Test

on:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      robot:
        description: Kaldt af robotten, som selv bygger siderne bagefter. Springer tjekkene af de byggede sider over.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: 1. Unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Kun koden; de byggede sider og data er ikke nødvendige her. Forsidens test (tests/unit/forside.test.mjs) ser efter,
      # at billederne fra avis/forside.json ligger i assets/nyt/, og at vagt.html henter delene.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /avis/
            /api/
            /assets/nyt/
            /tests/
            /vagt.html
            /package.json
            /package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: 2. Integrationstest
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Hele repoet: ordindekset bygges fra data/, og linktjekket læser alle sider
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: php --version
      - run: npm run test:integration
        env:
          SPRING_INDHOLD: ${{ inputs.robot && '1' || '' }}

  e2e:
    name: 3. E2E-test
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # data/ skal med, fordi siderne bygges før testen
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/identitet/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Siderne bygges med den nyeste kode, så testen måler det, robotten uploader. De byggede sider i repoet er fra
      # robottens sidste kørsel. Måles de, kan en rettelse i skabelonen ikke komme igennem, før robotten har bygget
      # siderne om, og robotten kører først, når testene er grønne.
      - name: Byg siderne
        run: node avis/byg.mjs
        env:
          SITE_URL: https://sagsvagt.dk/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Gem rapport og spor
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rapport
          path: test-resultater/
          retention-days: 14

  performance:
    name: 4. Performancetest
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/identitet/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Byg siderne
        run: node avis/byg.mjs
        env:
          SITE_URL: https://sagsvagt.dk/
      # Lighthouse bruger den Chrome, der følger med maskinen
      - run: npm run test:perf
      - name: Gem Lighthouse-rapporterne
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: test-resultater/lighthouse/
          retention-days: 14
