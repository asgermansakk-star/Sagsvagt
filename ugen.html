<style>
/* Ugens sager: et feed, der slutter. Ét kort pr. skærm, swipe lodret, og til sidst et slutkort med tilmelding. */
:root {
  --nat: #0E0F14; --grafit: #2A2B33; --kalk: #E6DFD3; --kalk-lys: #EEE8DE; --kalk-mork: #D9D1C3; --muted: #56535A; --rule: #CFC6B8;
  --bordeaux: #3E0E14; --vin: #8A2430; --rubin: #B04A50; --rosen: #DCA9A5; --blaek: #0C1430; --indigo: #28377A; --skifer: #5D6BA8; --lyng: #B7BBD8;
  --moedet: radial-gradient(80% 110% at 0% 20%, var(--skifer) 0%, var(--indigo) 26%, var(--blaek) 54%, transparent 76%), radial-gradient(75% 100% at 100% 100%, var(--rubin) 0%, var(--vin) 26%, var(--bordeaux) 54%, transparent 78%), var(--nat);
  --sans: "Montserrat", system-ui, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--nat); color: var(--kalk); font: 400 1.0625rem/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--lyng); outline-offset: 3px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top { position: fixed; inset: 0 0 auto; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: max(12px, env(safe-area-inset-top)) 16px 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.top .logo { display: flex; min-height: 44px; align-items: center; }
.top .logo svg { height: 34px; width: auto; margin-left: -6px; }
.taeller { font: 600 .8125rem/1 var(--sans); font-variant-numeric: tabular-nums; color: rgba(230,223,211,.8); background: rgba(14,15,20,.5);
  padding: 8px 12px; border-radius: 999px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.taeller[hidden] { display: none; }
.fremskridt { position: fixed; inset: 0 0 auto; height: 3px; z-index: 11; background: rgba(230,223,211,.12); }
.fremskridt i { display: block; height: 100%; width: 0; background: var(--rosen); transition: width .3s var(--ease); }

.feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior-y: contain; scroll-behavior: smooth; }
.kort { min-height: 100svh; scroll-snap-align: start; scroll-snap-stop: always; display: grid; grid-template-columns: minmax(0, 1fr); align-items: center; overflow-wrap: break-word; hyphens: auto;
  padding: calc(72px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
.indre { width: 100%; max-width: 480px; margin: 0 auto; }
.moedet { background: var(--moedet); }

/* Intro og slut */
.kicker { font: 600 .8125rem/1.3 var(--sans); color: rgba(230,223,211,.72); margin: 0 0 10px; }
h1, h2 { margin: 0; letter-spacing: -.02em; }
h1 { font-size: clamp(2.1rem, 1.5rem + 3vw, 2.75rem); line-height: 1.08; font-weight: 700; }
.lead { margin: 16px 0 0; color: rgba(230,223,211,.84); font-size: 1.0625rem; }
.emner { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; }
.emne { font: 600 .9375rem/1 var(--sans); min-height: 44px; padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer;
  color: var(--kalk); background: transparent; box-shadow: inset 0 0 0 1.5px rgba(230,223,211,.35); transition: background .2s, color .2s, box-shadow .2s; }
.emne[aria-pressed="true"] { background: var(--kalk); color: var(--nat); box-shadow: none; }
.hjaelp { margin: 10px 0 0; font-size: .8125rem; color: rgba(230,223,211,.66); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 0; border-radius: 8px; cursor: pointer;
  font: 600 1.0625rem/1.2 var(--sans); text-decoration: none; transition: background .2s, box-shadow .2s, transform .15s var(--ease); }
.btn:active { transform: scale(.98); }
.btn-lys { background: var(--kalk); color: var(--nat); }
.btn-lys:hover { background: var(--kalk-lys); }
.btn-streg { background: transparent; color: var(--kalk); box-shadow: inset 0 0 0 1.5px rgba(230,223,211,.4); }
.btn-streg:hover { box-shadow: inset 0 0 0 1.5px var(--kalk); }
.handlinger { display: grid; gap: 10px; margin-top: 28px; }
.swipe { margin: 28px 0 0; display: flex; align-items: center; gap: 8px; font-size: .8125rem; color: rgba(230,223,211,.66); }
.swipe svg { animation: hop 1.8s var(--ease) infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* Sagskortet */
.sag { background: var(--kalk); color: var(--nat); border-radius: 14px; padding: 24px 20px 20px; display: grid; gap: 14px; }
.sag .linje { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.status { font: 700 .75rem/1 var(--sans); padding: 6px 10px; border-radius: 6px; background: var(--kalk-mork); color: var(--grafit); }
.status.kommer { background: var(--lyng); color: var(--blaek); }
.status.besluttet { background: var(--rosen); color: var(--bordeaux); }
.tag { font: 600 .75rem/1 var(--sans); padding: 6px 10px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--rule); color: var(--muted); }
.sag h2 { font-size: clamp(1.375rem, 1.1rem + 1.4vw, 1.625rem); line-height: 1.2; font-weight: 700; }
.sag p { margin: 0; color: #3E3B40; font-size: 1rem; line-height: 1.55; }
.sag .hvem { font-size: .8125rem; color: var(--muted); }
.sag .kt { font-size: .8125rem; color: var(--muted); margin-top: -6px; }
.sag .fordi { font: 600 .8125rem/1.3 var(--sans); color: var(--vin); }
.del { background: transparent; color: var(--nat); box-shadow: inset 0 0 0 1.5px var(--rule); }
.sag .knapper { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; border-top: 1px solid var(--rule); }
.sag .knapper a, .sag .knapper button { font: 600 .9375rem/1 var(--sans); min-height: 44px; padding: 10px 14px; border-radius: 8px; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.foelg { background: var(--nat); color: var(--kalk); }
.foelg[aria-pressed="true"] { background: var(--vin); }
.laes { background: transparent; color: var(--nat); box-shadow: inset 0 0 0 1.5px var(--rule); }
.laes:hover { box-shadow: inset 0 0 0 1.5px var(--nat); }
.kilde { margin-left: auto; background: transparent; color: var(--indigo); padding-inline: 4px !important; }

.slut .fulgte { margin: 20px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.slut .fulgte span { font: 600 .8125rem/1 var(--sans); padding: 8px 12px; border-radius: 6px; background: var(--kalk); color: var(--nat); }
.svar { min-height: 1.2em; margin: 8px 0 0; font-size: .8125rem; color: rgba(230,223,211,.8); }
.tom { text-align: left; }

@media (prefers-reduced-motion: reduce) {
  .feed { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition-duration: .001ms !important; }
}
  .spring { position: absolute; left: 16px; top: -64px; z-index: 60; padding: 10px 16px; border-radius: 8px; background: #E6DFD3; color: #0E0F14; font-weight: 600; text-decoration: none; }
  .spring:focus { top: 12px; }
  .sk-emne { display: inline-block; height: 44px; pointer-events: none; border-color: transparent !important; background: linear-gradient(90deg, rgba(230,223,211,.12) 0 40%, rgba(230,223,211,.24) 50%, rgba(230,223,211,.12) 60% 100%) 0 0 / 250% 100% !important; animation: skelet 1.4s ease-in-out infinite; }
  @keyframes skelet { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .sk-emne { animation: none; } }
  .besked-fejl { padding: 10px 14px; border-radius: 8px; background: #F3DEDB; color: #8A2430; font-weight: 600; }
</style>

      <h1 id="intro-h">Det, politikerne besluttede i din by. På et minut.</h1>
      <p class="lead">Korte kort fra byrådet, udvalgene og lokaludvalgene. Swipe igennem, følg det, du går op i, og få det hver mandag.</p>
      <div class="emner" id="emner" role="group" aria-label="Vælg emner" aria-busy="true"><span class="emne sk-emne" style="width: 96px"></span><span class="emne sk-emne" style="width: 72px"></span><span class="emne sk-emne" style="width: 110px"></span><span class="emne sk-emne" style="width: 84px"></span><span class="emne sk-emne" style="width: 100px"></span><span class="emne sk-emne" style="width: 64px"></span></div>

<script type="module">
import { vaelgSager } from "./assets/mandagsmail.js";

const $ = (s, r = document) => r.querySelector(s);
const esc = (s = "") => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const klip = (t = "", n) => (t.length > n ? t.slice(0, n).replace(/\s+\S*$/, "") + " …" : t);
const kortDato = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString("da-DK", { timeZone: "UTC", day: "numeric", month: "short" });
const feed = $("#feed"), bar = $("#bar"), taeller = $("#taeller");

// Emnerne står som skeletter, og knappen er slået fra, til sagerne er hentet
const data = await fetch("assets/sager.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(() => null);
if (!data) { $("#emner").outerHTML = `<p class="besked-fejl" role="alert">Ugens sager kunne ikke hentes lige nu. Prøv igen om lidt.</p>`; throw new Error("sager.json"); }
$("#emner").replaceChildren(); $("#emner").removeAttribute("aria-busy"); $("#start").disabled = false;
const valgt = new Set(), fulgt = new Set();

// Emne-knapperne på introkortet
for (const [id, e] of Object.entries(data.emner)) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "emne"; b.textContent = e.navn; b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => { valgt.has(id) ? valgt.delete(id) : valgt.add(id); b.setAttribute("aria-pressed", valgt.has(id)); });
  $("#emner").append(b);
}

const status = (s) => s.st === "kommer" ? `<span class="status kommer">På dagsordenen ${kortDato(s.dato)}</span>`
  : s.st === "besluttet" ? `<span class="status besluttet">Besluttet ${kortDato(s.dato)}</span>` : `<span class="status">Behandlet ${kortDato(s.dato)}</span>`;

function sagKort(s, i, n) {
  // Valgte man emner, står det, hvorfor kortet er med; uden valg viser vi ugens vigtigste
  const fordi = s.e.filter((id) => valgt.has(id)).slice(0, 2);
  const emne = fordi[0] || s.e.find((id) => data.emner[id]);
  const navn = emne ? data.emner[emne].navn : "";
  return `<section class="kort" aria-label="Sag ${i + 1} af ${n}" data-i="${i + 1}">
    <div class="indre"><article class="sag">
      <div class="linje">${status(s)}${s.e.filter((id) => data.emner[id]).slice(0, 2).map((id) => `<span class="tag">${esc(data.emner[id].navn)}</span>`).join("")}</div>
      ${fordi.length ? `<p class="fordi">Fordi du valgte ${esc(fordi.map((id) => data.emner[id].navn.toLowerCase()).join(" og "))}</p>` : ""}
      <h2>${esc(s.t)}</h2>
      ${s.kt ? `<p class="kt">Kommunens titel: ${esc(s.kt)}</p>` : ""}
      <p>${esc(klip(s.d || s.x || "", 260))}</p>
      <p class="hvem">${esc(s.u)}</p>
      <div class="knapper">
        ${emne ? `<button class="foelg" type="button" data-emne="${emne}" aria-pressed="${fulgt.has(emne)}">${fulgt.has(emne) ? "Følger" : "Følg"} ${esc(navn.toLowerCase())}</button>` : ""}
        <a class="laes" href="${esc(s.url)}">Læs sagen</a>
        <button class="del" type="button" data-del="${esc(s.url)}" data-titel="${esc(s.t)}">Del</button>
        <a class="kilde" href="${esc(s.k)}" target="_blank" rel="noopener">Kilde</a>
      </div>
    </article></div>
  </section>`;
}

function slutKort(n) {
  return `<section class="kort moedet slut" aria-labelledby="slut-h" data-i="slut">
    <div class="indre">
      <p class="kicker">${n ? `Du har set alle ${n} sager` : "Ingen sager lige nu"}</p>
      <h1 id="slut-h">${n ? "Det var ugen." : "Stille uge i dine emner."}</h1>
      <p class="lead">Få de sager, der handler om det, du følger, i én mail hver mandag kl. 07.00. Gratis, og du kan afmelde med ét klik.</p>
      <div class="fulgte" id="fulgte"></div>
      <div class="handlinger">
        <a class="btn btn-lys" id="tilmeld" href="vagt.html?fra=ugen#tilmeld">Få dem hver mandag</a>
        <button class="btn btn-streg" id="del" type="button">Del med en ven</button>
        <button class="btn btn-streg" id="forfra" type="button">Start forfra</button>
      </div>
      <p class="svar" id="svar" aria-live="polite"></p>
    </div>
  </section>`;
}

// Tilmeldingslinket tager de fulgte emner med (vagt.html udfylder feltet "Andre emner" fra ?emne=)
function opdaterSlut() {
  const navne = [...fulgt].map((id) => data.emner[id].navn);
  const f = $("#fulgte"), a = $("#tilmeld");
  if (!f) return;
  f.innerHTML = navne.map((n) => `<span>${esc(n)}</span>`).join("");
  a.href = `vagt.html?fra=ugen${navne.length ? `&emne=${encodeURIComponent(navne.join(", ").slice(0, 80))}` : ""}#tilmeld`;
}

function byg() {
  const idag = new Date().toISOString().slice(0, 10);
  const emner = valgt.size ? [...valgt] : Object.keys(data.emner);
  const v = vaelgSager({ data, profil: { emner }, idag });
  const sager = [...v.besluttet, ...v.kommer];
  [...feed.querySelectorAll("[data-i]")].forEach((el) => el.remove());
  feed.insertAdjacentHTML("beforeend", sager.map((s, i) => sagKort(s, i, sager.length)).join("") + slutKort(sager.length));
  opdaterSlut();
  observer.disconnect();
  feed.querySelectorAll(".kort").forEach((k) => observer.observe(k));
  return sager.length;
}

// Tælleren og stregen øverst følger det kort, der fylder skærmen
let antal = 0;
const observer = new IntersectionObserver((es) => es.forEach((e) => {
  if (!e.isIntersecting) return;
  const i = e.target.dataset.i;
  taeller.hidden = !i || i === "slut";
  if (i && i !== "slut") taeller.textContent = `${i} af ${antal}`;
  bar.style.width = !i ? "0" : i === "slut" ? "100%" : `${(i / (antal + 1)) * 100}%`;
}), { root: feed, threshold: 0.6 });

// Kortene står klar fra start, så man kan swipe med det samme; vælger man emner, bygges de om
antal = byg();
$("#emner").addEventListener("click", (e) => { if (e.target.closest(".emne")) antal = byg(); });
$("#start").addEventListener("click", () => feed.querySelector("[data-i]").scrollIntoView());

feed.addEventListener("click", (e) => {
  const f = e.target.closest(".foelg");
  if (f) {
    const id = f.dataset.emne, paa = !fulgt.has(id);
    paa ? fulgt.add(id) : fulgt.delete(id);
    // Samme emne kan stå på flere kort
    feed.querySelectorAll(`.foelg[data-emne="${id}"]`).forEach((b) => { b.setAttribute("aria-pressed", paa); b.textContent = `${paa ? "Følger" : "Følg"} ${data.emner[id].navn.toLowerCase()}`; });
    opdaterSlut();
  }
  if (e.target.closest("#forfra")) feed.scrollTo({ top: 0 });
  // Del én sag: linket til sagssiden, som har sit eget delebillede og en faktuel beskrivelse
  const d = e.target.closest("[data-del]");
  if (d) {
    const url = `https://sagsvagt.dk/${d.dataset.del}?fra=del`;
    if (navigator.share) navigator.share({ title: d.dataset.titel, url }).catch(() => {});
    else navigator.clipboard.writeText(url).then(() => { d.textContent = "Kopieret"; setTimeout(() => (d.textContent = "Del"), 1600); }, () => {});
  }
  if (e.target.closest("#del")) {
    const url = "https://sagsvagt.dk/ugen.html?fra=del";
    if (navigator.share) navigator.share({ title: "Ugens sager", text: "Det, politikerne i København besluttede i denne uge, på et minut.", url }).catch(() => {});
    else navigator.clipboard.writeText(url).then(() => { $("#svar").textContent = "Linket er kopieret."; }, () => {});
  }
});
</script>
</body>
